plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'org.web3j' version '4.14.0'
}

group = 'org.web3j'
version = '0.2.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

web3j {
    generatedPackageName = 'org.web3j.generated.contracts'
}

solidity {
    version = '0.8.19'
    resolvePackages = false
}

dependencies {
    implementation 'org.web3j:core:4.14.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

application {
    mainClass = 'org.web3j.Web3App'
}

tasks.register('importDevWallet', JavaExec) {
    group = 'development'
    description = 'Import a disposable Ganache private key into an ignored encrypted keystore'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.web3j.ImportDevWallet'
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveClassifier = 'all'
    zip64 = true
    manifest {
        attributes 'Main-Class': 'org.web3j.Web3App'
    }
}
